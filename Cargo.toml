[workspace]
members = ["crates/*"]
exclude = ["web-ui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
mem-core = { path = "crates/mem-core" }
mem-store = { path = "crates/mem-store" }
mem-embed = { path = "crates/mem-embed" }
mem-ai = { path = "crates/mem-ai" }
mem-profile = { path = "crates/mem-profile" }
mem-episodic = { path = "crates/mem-episodic" }
mem-skills = { path = "crates/mem-skills" }
mem-portability = { path = "crates/mem-portability" }
mem-web = { path = "crates/mem-web" }
mem-bridge = { path = "crates/mem-bridge" }
turso = "0.8.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
async-trait = "0.1"
futures = "0.3"
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-rustls", "api-31", "half"] }
tokenizers = { version = "=1.0.0-rc.2", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
tower = { version = "0.5", default-features = false, features = ["timeout", "util"] }
axum = "0.8"
tower-http = { version = "0.6", default-features = false, features = ["fs", "catch-panic", "timeout"] }
base64 = "0.22"
subtle = "2"
url = "2"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonc-parser = { version = "0.34", features = ["serde"] }
serde_path_to_error = "0.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
zeroize = "1"
libc = "0.2"
whatlang = "=0.16.4"

[package]
name = "opencode-agents-memory"
version.workspace = true
edition.workspace = true

[dependencies]
mem-ai = { workspace = true }
mem-bridge = { workspace = true }
mem-core = { workspace = true }
mem-embed = { workspace = true }
mem-episodic = { workspace = true }
mem-profile = { workspace = true }
mem-store = { workspace = true }
mem-skills = { workspace = true }
mem-portability = { workspace = true }
mem-web = { workspace = true }
