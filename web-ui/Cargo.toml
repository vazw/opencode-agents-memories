[package]
name = "web-ui"
version = "0.1.0"
edition = "2024"
publish = false
description = "The OpenCode Memory Explorer app shell (Leptos CSR + Thaw), served statically by mem-web"

[lib]
name = "web_ui"
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.7", default-features = false, features = ["csr"] }
leptos_router = { version = "0.7", default-features = false }
leptos_meta = { version = "0.7", default-features = false }
thaw = { version = "0.4.8", default-features = false, features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Request",
    "RequestInit",
    "RequestMode",
    "RequestCredentials",
    "Response",
    "Headers",
    "ReferrerPolicy",
    "Storage",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "HtmlAnchorElement",
    "HtmlElement",
    "Document",
    "Element",
    "Location",
] }
js-sys = "0.3"
base64 = "0.22"
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
